; M5Stack CoreS3 BLHeli_32 ESC programmer (USB host -> Betaflight passthrough -> 4-way interface)

[env:m5stack-cores3]
platform = espressif32@6.9.0
board = m5stack-cores3
framework = arduino
lib_deps =
    m5stack/M5Unified@^0.1.16
; The CoreS3 USB-C port is switched to USB host mode, so TinyUSB/USB-CDC-on-boot must stay off.
build_unflags =
    -std=gnu++11
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
